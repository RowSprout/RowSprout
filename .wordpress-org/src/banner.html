<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Inter;src:url(inter-latin-wght.woff2) format("woff2");font-weight:100 900}
@font-face{font-family:Archivo;src:url(archivo-latin-wght.woff2) format("woff2");font-weight:100 900}
html,body{margin:0;width:772px;height:250px;overflow:hidden}
body{background:radial-gradient(120% 140% at 85% 20%,#24459c 0%,#1e3a8a 45%,#152a66 100%);font-family:Inter,sans-serif;color:#F6F5F2;position:relative}
.left{position:absolute;left:44px;top:66px;width:380px}
.left img{width:290px;display:block}
.tag{margin-top:20px;font-family:Archivo,sans-serif;font-weight:600;font-size:21px;line-height:1.25;letter-spacing:-.01em}
.tag span{color:#F59A45}
.sub{margin-top:8px;font-size:12.5px;opacity:.72}
/* illustration */
.table{position:absolute;left:452px;top:52px;width:150px;background:#F6F5F2;border-radius:10px;box-shadow:0 10px 30px rgb(0 0 0/.25);padding:8px 0}
.row{display:flex;align-items:center;gap:7px;height:22px;padding:0 10px;border-top:1px solid #e3e1db}
.row:first-child{border-top:0;height:18px}
.row:first-child i{background:#5b6272;opacity:.5;height:5px}
.row b{width:7px;height:7px;border-radius:50%;background:#D9661F;flex:none}
.row:first-child b{background:transparent}
.row i{display:block;height:6px;border-radius:3px;background:#1e3a8a;opacity:.85}
.row i+i{opacity:.3}
.arrow{position:absolute;left:612px;top:118px;width:34px;height:2px;background:#F59A45}
.arrow:after{content:"";position:absolute;right:-2px;top:-5px;border:6px solid transparent;border-left:8px solid #F59A45;border-right:0}
.pages{position:absolute;left:660px;top:46px}
.page{position:absolute;width:66px;height:84px;border-radius:8px;background:#F6F5F2;box-shadow:0 8px 22px rgb(0 0 0/.25);padding:9px;box-sizing:border-box}
.page:nth-child(1){left:22px;top:0;background:#5469A4}
.page:nth-child(2){left:11px;top:34px;background:#95A1C3}
.page:nth-child(3){left:0;top:68px}
.page i{display:block;height:5px;border-radius:3px;background:#1e3a8a;margin-bottom:6px}
.page i:first-child{height:14px;background:#D9661F;opacity:.9;border-radius:4px}
.page i:nth-child(3){width:70%;opacity:.35}.page i:nth-child(4){width:85%;opacity:.35}
</style></head><body>
<div class="left"><img src="rowsprout-logo-horizontaal-donker.svg" alt="">
<div class="tag">Design one page.<br>Get a page for <span>every row.</span></div>
<div class="sub">For the block editor, Elementor and WPBakery.</div></div>
<div class="table">
<div class="row"><b></b><i style="width:42px"></i><i style="width:50px"></i></div>
<div class="row"><b></b><i style="width:48px"></i><i style="width:40px"></i></div>
<div class="row"><b></b><i style="width:36px"></i><i style="width:56px"></i></div>
<div class="row"><b></b><i style="width:52px"></i><i style="width:34px"></i></div>
<div class="row"><b></b><i style="width:40px"></i><i style="width:48px"></i></div>
<div class="row"><b></b><i style="width:46px"></i><i style="width:38px"></i></div>
</div>
<div class="arrow"></div>
<div class="pages"><div class="page"></div><div class="page"></div><div class="page"><i></i><i></i><i></i><i></i></div></div>
</body></html>
