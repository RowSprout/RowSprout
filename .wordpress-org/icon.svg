<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
<style>
/* Plays once (3.6s) and ends on the full logo: the front card pops in, the leaf sprouts, two pages fan out behind it while the stack re-centres. */
.a{animation:3.6s cubic-bezier(.2,.8,.2,1) .3s 1 both}
.front{transform-origin:42px 59px;animation-name:front}
.leaf{transform-origin:30px 78px;animation-name:leaf}
.mid{animation-name:mid}
.back{animation-name:back}
.shift{animation-name:shift}
@keyframes front{0%{opacity:0;transform:scale(.7)}19%,100%{opacity:1;transform:scale(1)}}
@keyframes leaf{0%,19%{transform:scale(0) rotate(-25deg)}46%{transform:scale(1.12) rotate(4deg)}58%,100%{transform:scale(1) rotate(0)}}
@keyframes mid{0%,58%{opacity:0;transform:translate(0,0)}81%,100%{opacity:1;transform:translate(8px,-9px)}}
@keyframes back{0%,73%{opacity:0;transform:translate(0,0)}100%{opacity:1;transform:translate(16px,-18px)}}
@keyframes shift{0%,58%{transform:translate(8px,-9px)}100%{transform:translate(0,0)}}
@media (prefers-reduced-motion:reduce){.a{animation:none}}
</style>
<rect width="256" height="256" fill="#1E3A8A"/>
<g transform="translate(128 128) scale(2.5) translate(-50 -50)"><g class="a shift">
<rect class="a back" x="16" y="28" width="52" height="62" rx="8" fill="#F6F5F2" fill-opacity="0.25"/>
<rect class="a mid" x="16" y="28" width="52" height="62" rx="8" fill="#F6F5F2" fill-opacity="0.55"/>
<rect class="a front" x="16" y="28" width="52" height="62" rx="8" fill="#F6F5F2"/>
<path class="a leaf" d="M30 78 C30 60 40 50 56 48 C56 66 46 76 30 78 Z" fill="#F59A45"/>
</g></g>
</svg>
